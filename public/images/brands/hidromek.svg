<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 96" role="img" aria-label="Hidromek">
  <!-- HİDROMEK — ağır kesim endüstriyel wordmark (kurumsal siyah + kırmızı nokta aksanı) -->
  <g>
    <text x="10" y="72" font-family="Arial Black, Arial, Helvetica, sans-serif"
          font-weight="900" font-size="62" letter-spacing="2"
          textLength="540" lengthAdjust="spacingAndGlyphs" fill="#111111">HıDROMEK</text>
    <!-- İ harfinin kırmızı nokta aksanı (marka kimliği) -->
    <rect x="88" y="12" width="16" height="14" rx="2" fill="#E30613"/>
  </g>
</svg>
