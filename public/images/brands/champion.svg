<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 130" role="img" aria-label="Champion Motor Graders">
  <!-- Champion Motor Graders — dişli amblem + italik wordmark (resmi logodan vektörize) -->
  <g fill="#111111">
    <!-- Dişli çark: 12 diş -->
    <g transform="translate(62,65)">
      <g>
        <rect x="-7" y="-62" width="14" height="18" rx="2"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(30)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(60)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(90)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(120)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(150)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(180)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(210)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(240)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(270)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(300)"/>
        <rect x="-7" y="-62" width="14" height="18" rx="2" transform="rotate(330)"/>
      </g>
      <circle r="48"/>
      <!-- İç beyaz kıvılcım / bıçak izi -->
      <path d="M -26,22 C -8,10 6,-2 30,-30 L 14,-6 C 4,8 -8,18 -26,22 Z" fill="#ffffff"/>
      <path d="M -16,34 C 6,22 22,6 38,-14 L 26,10 C 14,24 0,32 -16,34 Z" fill="#ffffff" opacity="0.9"/>
    </g>
    <!-- CHAMPION — italik, ağır kesim -->
    <text x="132" y="78" font-family="Arial Black, Arial, Helvetica, sans-serif"
          font-weight="900" font-style="italic" font-size="64"
          letter-spacing="1" textLength="466" lengthAdjust="spacingAndGlyphs">CHAMPION</text>
    <!-- MOTOR GRADERS — alt satır, geniş aralıklı -->
    <text x="138" y="112" font-family="Arial, Helvetica, sans-serif"
          font-weight="bold" font-size="27" letter-spacing="6"
          textLength="458" lengthAdjust="spacingAndGlyphs">MOTOR GRADERS</text>
  </g>
</svg>
